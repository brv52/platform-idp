# Publishes the images bench/attacks/ tries to admit. Run manually after a
# release exists (it copies the signed ghcr.io/<owner>/demo-api:main):
#
#   gh workflow run attack-fixtures.yml
#
#   :attack-unsigned   built here, never signed
#   :attack-swapped    the tag first points at the signed release digest, then
#                      is re-pointed at a tampered copy (extra layer) - the
#                      classic "tag moved after signing" attack
#   :attack-foreign    signed keyless, but by THIS workflow, not release.yml,
#                      and carries a forged SLSA predicate that claims the
#                      official builder ID. Only the signer identity gives it away.
name: attack-fixtures

on:
  workflow_dispatch:

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/demo-api
  COSIGN_VERSION: v3.1.3

jobs:
  fixtures:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tampered layer
        run: |
          mkdir -p tamper && echo "injected after signing" > tamper/IMPLANT
          tar -C tamper -cf tamper.tar IMPLANT

      - name: attack-unsigned
        run: |
          crane append -b "${IMAGE}:main" -f tamper.tar -t "${IMAGE}:attack-unsigned"
          echo "unsigned  $(crane digest "${IMAGE}:attack-unsigned")" >> "$GITHUB_STEP_SUMMARY"

      - name: attack-swapped
        run: |
          signed=$(crane digest "${IMAGE}:main")
          crane copy "${IMAGE}@${signed}" "${IMAGE}:attack-swapped"
          crane append -b "${IMAGE}@${signed}" -f tamper.tar -t "${IMAGE}:attack-swapped"
          {
            echo "swapped   signed digest  ${signed}"
            echo "swapped   tag now        $(crane digest "${IMAGE}:attack-swapped")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: attack-foreign
        run: |
          crane append -b "${IMAGE}:main" -f tamper.tar -t "${IMAGE}:attack-foreign"
          ref="${IMAGE}@$(crane digest "${IMAGE}:attack-foreign")"
          cosign sign --yes "$ref"
          # Forged provenance: right builder ID and source, wrong signer.
          jq -n --arg repo "git+https://github.com/${GITHUB_REPOSITORY}@refs/heads/main" '{
            buildType: "https://github.com/slsa-framework/slsa-github-generator/container@v1",
            builder: {id: "https://github.com/slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@refs/tags/v2.1.0"},
            invocation: {configSource: {uri: $repo, entryPoint: ".github/workflows/release.yml", digest: {sha1: env.GITHUB_SHA}}}
          }' > forged.json
          cosign attest --yes --type slsaprovenance --predicate forged.json "$ref"
          echo "foreign   ${ref}" >> "$GITHUB_STEP_SUMMARY"
