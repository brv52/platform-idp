apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - services.yaml
  - rollout.yaml
  - ../../../rollouts/analysis
labels:
  - pairs:
      app.kubernetes.io/part-of: platform-idp
    includeSelectors: false
configurations:
  - kustomizeconfig.yaml
# A release is a change to the image below or to release.env. Both change
# the pod template, which creates a new ReplicaSet revision and a canary.
configMapGenerator:
  - name: demo-api-release
    envs: [release.env]
# Pinned by digest to the image release.yml built, signed and attested
# (Kyverno would resolve and pin a tag anyway; pinning in git keeps the
# desired state exact and makes Argo CD diffs meaningful).
images:
  - name: demo-api
    newName: ghcr.io/brv52/demo-api
    digest: sha256:77c21dd19b183d31cee9a024d45f9b82d3cf55f8e7929b4a71e6af6aa9c53d91
