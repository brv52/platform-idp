apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    # The chart renders `labels: {}` on several CRDs, which the API server
    # drops; a client-side diff would report them OutOfSync forever.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://kyverno.github.io/kyverno
      chart: kyverno
      targetRevision: 3.9.1 # Kyverno v1.19.1
      helm:
        valueFiles:
          - $values/gitops/platform/kyverno/values.yaml
    - repoURL: https://github.com/brv52/platform-idp.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Kyverno CRDs exceed the client-side apply annotation size limit.
      - ServerSideApply=true
